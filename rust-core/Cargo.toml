[package]
name = "sed_core"
version = "1.0.0"
edition = "2021"

[lib]
name = "sed_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"
rand = "0.8"
chrono = "0.4"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "json"] }
lopdf = "0.32"

[profile.release]
opt-level = 2
strip = true
